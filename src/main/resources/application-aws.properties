# AWS Lambda 배포 전용 프로파일.
# AwsLambdaHandler가 부팅 시 spring.profiles.active=aws를 지정해서 활성화한다.
# 여기 없는 값은 application.properties(기본 프로파일)의 값을 그대로 물려받는다.

# API Gateway가 TLS를 종단 처리하므로 애플리케이션 레벨 SSL은 사용하지 않는다.
server.ssl.enabled=false
server.port=8080

# aws-serverless-java-container도 OciFunctionHandler와 동일하게 컨테이너 경유 없이
# DispatcherServlet.service()를 직접 호출하는 방식이라, 기본값(-1)이면 ServletConfig가 없어
# NPE가 난다(OCI Functions 작업에서 실측으로 확인된 문제와 동일한 원인).
spring.mvc.servlet.load-on-startup=1

# OCI Compute VM의 MySQL(3306)이 외부 인터넷에서 직접 접속을 시도하면 계속 타임아웃됨
# (Security List/NSG/iptables 전부 열어도 재현됨 — OCI/리전 네트워크 레벨의 3306 자체 차단으로
# 추정, 원인 특정 실패). 22번(SSH)은 외부에서 정상 동작하는 것으로 확인되어, 로컬 개발 때와
# 동일하게 SSH 터널을 경유하는 tunnel 모드로 접속한다. SshTunnelManager/SshTunnel(JSch)이
# Lambda 실행 환경에서도 그대로 동작함(순수 Java, 특별한 OS 권한/파일시스템 쓰기 불필요).
app.datasource.mode=tunnel

# Lambda 컨테이너는 자주 새로 뜰 수 있어 커넥션 풀을 작게 유지한다.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# 콜드스타트마다 스키마 검사/변경을 반복하지 않도록 update 대신 validate 사용.
spring.jpa.hibernate.ddl-auto=validate

# 배포된 프론트엔드 도메인으로 반드시 교체해서 Lambda 환경변수로 주입해야 한다.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# 프론트엔드(localhost:3000)와 이 백엔드(execute-api.amazonaws.com)가 서로 다른 도메인이라
# 브라우저 입장에서 cross-site 요청이 됨. SameSite 기본값(Lax)이면 XHR 요청에 세션 쿠키가
# 실리지 않아 로그인 직후에도 계속 401이 남 -> None으로 명시(Secure 필수, API Gateway가
# 항상 HTTPS라 문제없음). 로컬 개발 프로파일에는 영향 없음(이 파일은 aws 프로파일 전용).
server.servlet.session.cookie.same-site=None
# API Gateway가 항상 HTTPS로 종단하지만, Lambda 내부의 요청 스킴 인식이 정확하지 않아
# Secure 속성이 자동으로 안 붙는 문제가 실측 확인됨(SameSite=None인데 Secure 없는 쿠키는
# 최신 브라우저가 아예 저장을 거부함). 자동판단에 맡기지 않고 명시적으로 강제한다.
server.servlet.session.cookie.secure=true

# Lambda는 요청마다 같은 인스턴스가 처리한다는 보장이 없어 메모리 세션이 인스턴스 간 공유되지
# 않는 문제가 실측으로 확인됨(로그인 직후 병렬 API 호출 일부는 401, 일부는 세션 일부값 누락으로
# 400). MySQL에 세션을 공유 저장해서 해결한다. 스키마(SPRING_SESSION*)는 DB에 미리 수동으로
# 생성해뒀으므로 여기서는 initialize-schema를 켜지 않는다(always로 두면 재기동마다 CREATE TABLE이
# 중복 실행돼 에러남 - Spring Session 스키마 스크립트에 IF NOT EXISTS가 없음).
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# AWS_ACCESS_KEY_ID/AWS_SECRET_KEY는 둘 다 Lambda 런타임이 예약한 환경변수 이름이라
# 함수 환경변수로 직접 설정할 수 없다(설정 시도 시 Lambda가 거부함, 실측 확인됨). 그래서 이
# 프로파일에서만 다른 이름(APP_ 접두사)의 환경변수를 받아 기존 프로퍼티 키에 매핑한다.
aws.access-key-id=${APP_AWS_ACCESS_KEY_ID}
aws.secret-access-key=${APP_AWS_SECRET_KEY}

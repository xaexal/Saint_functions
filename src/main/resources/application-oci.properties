# OCI Functions 배포 전용 프로파일.
# OciFunctionHandler가 부팅 시 spring.profiles.active=oci를 지정해서 활성화한다.
# 여기 없는 값은 application.properties(기본 프로파일)의 값을 그대로 물려받는다.

# API Gateway가 TLS를 종단 처리하므로 애플리케이션 레벨 SSL은 사용하지 않는다.
server.ssl.enabled=false
server.port=8080

# 기본값(-1)은 첫 실제 HTTP 요청이 서블릿 컨테이너를 통해 들어올 때까지 DispatcherServlet.init()을
# 지연시킨다. OciFunctionHandler는 컨테이너 경유 요청 없이 DispatcherServlet.service()를 직접
# 호출하므로, 미리 초기화해 두지 않으면 ServletConfig가 없어 NPE가 난다(실측으로 확인됨).
spring.mvc.servlet.load-on-startup=1

# SSH 터널 없이, Functions Subnet과 같은 VCN에 있는 Compute VM 사설 IP로 직접 접속.
# app.datasource.mode=direct이면 SshTunnelManager는 아무 것도 하지 않는다(기존 코드 그대로 재사용).
app.datasource.mode=direct
app.datasource.direct-host=${DB_DIRECT_HOST:10.0.0.14}
app.datasource.direct-port=${DB_DIRECT_PORT:3306}

# Functions 컨테이너는 자주 새로 뜰 수 있어 커넥션 풀을 작게 유지한다.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# 콜드스타트마다 스키마 검사/변경을 반복하지 않도록 update 대신 validate 사용.
# (스키마 자체는 로컬 tunnel 모드 실행 시 이미 ddl-auto=update로 반영되어 있다는 전제)
spring.jpa.hibernate.ddl-auto=validate

# 배포된 프론트엔드 도메인으로 반드시 교체해서 OCI Functions Configuration에 주입해야 한다.
# (WebConfig.java의 기본값은 로컬 개발용 https://localhost:3000)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

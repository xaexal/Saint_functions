spring.config.import=optional:file:secrets.properties
spring.application.name=Saint

# spring-session-jdbc가 클래스패스에 있으면 DataSource가 있는 한 Spring Boot가 자동으로 JDBC
# 세션 저장소를 골라버린다. 로컬 개발(단일 프로세스, 항상 같은 JVM)은 기존처럼 메모리 세션이면
# 충분하므로 기본 프로파일은 명시적으로 꺼두고, AWS Lambda 프로파일에서만 jdbc로 켠다.
spring.session.store-type=none
#server.port=8001
spring.devtools.livereload.enabled=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=xaexal
spring.datasource.password=${DB_PASSWORD}

# DB 접속 방식 선택: tunnel(SSH 터널 경유) 또는 direct(같은 서버에서 localhost로 직접 접속)
# 기본값은 direct. 이 컴퓨터에서는 실행 스크립트가 --app.datasource.mode=tunnel 인자를 넘겨서 덮어씀.
app.datasource.mode=direct
app.datasource.db-name=saint
app.datasource.direct-host=127.0.0.1
app.datasource.direct-port=3306
app.datasource.tunnel-local-port=3307

# SSH 터널 인증정보 (tunnel 모드에서만 사용, secrets.properties에서 주입).
# direct 모드(OCI 배포 등)에서는 SshTunnelManager가 아예 연결을 시도하지 않지만,
# @Value 바인딩 자체는 모드와 무관하게 일어나므로 값이 없을 때 기동이 막히지 않도록 기본값을 둔다.
ssh.tunnel.user=${SSH_TUNNEL_USER:unused}
ssh.tunnel.password=${SSH_TUNNEL_PASSWORD:unused}

# HikariCP 튜닝: SSH 터널 경유 커넥션이 유휴 상태에서 끊기지 않도록 keepalive를 명시하고,
# 죽은 커넥션을 오래 붙잡지 않도록 max-lifetime/connection-timeout을 짧게 설정
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1700000
spring.mail.host=smtp.naver.com
spring.mail.port=587
spring.mail.username=cavenagh@naver.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
server.servlet.session.timeout=120m
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

toss.client-key=${TOSS_CLIENT_KEY}
toss.secret-key=${TOSS_SECRET_KEY}

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_KEY}
aws.s3.region=ap-northeast-2
aws.s3.bucket-name=xaexal
logging.level.jdbc.resultset=OFF
logging.level.jdbc.resultsettable=OFF
spring.data.web.pageable.serialization-mode=via_dto

logging.level.jdbc.sqlonly=INFO
logging.level.jdbc.sqltiming=OFF
logging.level.jdbc.audit=OFF
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Ignore unknown JSON properties to prevent 400 Bad Request
spring.jackson.deserialization.fail-on-unknown-properties=false

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.kakao.client-id=eb98a51c2d020c164f93cbff6734c231
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=springboot

# Naver Registration
spring.security.oauth2.client.registration.naver.client-id=2HBUI7OI71S2EqFk6epv
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
